<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة الطلبات | مكتب آفاق</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #091222;
      --card-bg: #111d33;
      --card-border: #1e2d4a;
      --gold: #c5a059;
      --gold-hover: #e5be75;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 14px;
    }

    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; direction: rtl; }
    .container { max-width: 900px; margin: 0 auto; }

    /* Header */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border-bottom: 3px solid var(--gold);
    }
    .header-title h2 { font-size: 22px; color: var(--text); font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .header-title p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
    .btn-refresh {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-refresh:hover { background: var(--gold); color: var(--bg); }

    /* Counters */
    .counters-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .counter-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }
    .counter-value { font-size: 26px; font-weight: 800; color: var(--gold); margin-bottom: 5px; }
    .counter-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    /* Filters */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-input, .select-filter {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .search-input { flex: 1; }

    /* List & Cards */
    .requests-list { display: flex; flex-direction: column; gap: 15px; }
    .request-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      border-right: 5px solid var(--gold);
    }
    .request-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .app-id { font-weight: 800; color: var(--gold); font-size: 16px; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .status-new { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 14px; color: #cbd5e1; margin-bottom: 15px; }
    .info-grid div strong { color: var(--text-muted); }

    .card-actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid var(--card-border); padding-top: 15px; }
    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-transfer { background: var(--gold); color: var(--bg); }
    .btn-transfer:hover { background: var(--gold-hover); }

    .error-msg { text-align: center; color: var(--danger); font-weight: 700; padding: 30px; font-size: 16px; }
    .loader { text-align: center; color: var(--text-muted); padding: 30px; }

    @media (max-width: 600px) {
      .counters-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-bar { flex-direction: column; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="header-card">
    <div class="header-title">
      <h2><i class="fa-solid fa-user-shield" style="color: var(--gold);"></i> إدارة طلبات المعاملات القانونية</h2>
      <p>لوحة تحكم وتسيير طلبات العظام ومكتب آفاق</p>
    </div>
    <button class="btn-refresh" onclick="loadAllRequests()">
      <i class="fa-solid fa-rotate-right"></i> تحديث السجل
    </button>
  </header>

  <!-- Counter Stats -->
  <section class="counters-grid">
    <div class="counter-card">
      <div class="counter-value" id="count-total">0</div>
      <div class="counter-label">إجمالي المعاملات</div>
    </div>
    <div class="counter-card">
      <div class="counter-value" id="count-pending">0</div>
      <div class="counter-label">قيد المراجعة</div>
    </div>
    <div class="counter-card">
      <div class="counter-value" id="count-progress">0</div>
      <div class="counter-label">قيد التنفيذ</div>
    </div>
    <div class="counter-card">
      <div class="counter-value" id="count-completed">0</div>
      <div class="counter-label">مكتملة / جاهزة</div>
    </div>
  </section>

  <!-- Filters -->
  <section class="filter-bar">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 بحث باسم العميل، رقم الهاتف أو رقم الطلب..." oninput="filterRequests()">
    <select id="status-filter" class="select-filter" onchange="filterRequests()">
      <option value="ALL">جميع الحالات</option>
      <option value="جديد">جديد / قيد المراجعة</option>
      <option value="قيد التنفيذ">قيد التنفيذ</option>
      <option value="مكتمل">مكتملة / جاهزة</option>
    </select>
  </section>

  <!-- Requests Container -->
  <main id="requests-container" class="requests-list">
    <div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> جاري جلب البيانات من السيرفر...</div>
  </main>

</div>

<script>
  // الرابط الجديد المحدث للسيرفر
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkKlb0erWWgXWhvy52_eUYhG5aqj7b5CF2l5-m4M20J-6TzQDHO6_H75WB4pALe1XG/exec";

  let allRequestsData = [];

  document.addEventListener('DOMContentLoaded', loadAllRequests);

  // 1. جلب البيانات من Google Sheets
  async function loadAllRequests() {
    const container = document.getElementById('requests-container');
    container.innerHTML = `<div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> جاري جلب البيانات من السيرفر...</div>`;

    try {
      const response = await fetch(`${SCRIPT_URL}?query=ALL`);
      const result = await response.json();

      if (result.success && result.data) {
        allRequestsData = result.data;
        updateCounters(allRequestsData);
        renderRequests(allRequestsData);
      } else {
        container.innerHTML = `<div class="error-msg">تعذر جلب البيانات من السيرفر.</div>`;
      }
    } catch (error) {
      console.error(error);
      container.innerHTML = `<div class="error-msg">تعذر جلب البيانات من السيرفر.</div>`;
    }
  }

  // 2. تحديث العدادات
  function updateCounters(data) {
    document.getElementById('count-total').textContent = data.length;
    document.getElementById('count-pending').textContent = data.filter(r => r.status === 'جديد' || r.status === 'قيد المراجعة').length;
    document.getElementById('count-progress').textContent = data.filter(r => r.status === 'قيد التنفيذ').length;
    document.getElementById('count-completed').textContent = data.filter(r => r.status === 'مكتمل' || r.status === 'جاهز').length;
  }

  // 3. عرض الطلبات
  function renderRequests(data) {
    const container = document.getElementById('requests-container');
    if (data.length === 0) {
      container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding:30px;">لا توجد معاملات مطابقة.</div>`;
      return;
    }

    container.innerHTML = '';
    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'request-card';
      card.innerHTML = `
        <div class="request-header">
          <span class="app-id"><i class="fa-solid fa-folder-open"></i> ${item.appId}</span>
          <span class="status-badge status-new">${item.status || 'جديد'}</span>
        </div>
        <div class="info-grid">
          <div><strong>الاسم الكامل:</strong> ${item.fullName}</div>
          <div><strong>اسم الأم:</strong> ${item.motherName || 'غير مدخل'}</div>
          <div><strong>رقم الهاتف:</strong> ${item.phone}</div>
          <div><strong>الرقم الوطني:</strong> ${item.nationalId || 'غير مدخل'}</div>
          <div><strong>نوع الخدمة:</strong> ${item.mainService}</div>
          <div><strong>الدرجة:</strong> ${item.urgency || 'عادي'}</div>
        </div>
        <div class="card-actions">
          <button class="btn-action btn-transfer" onclick="transferToGovPortal('${item.appId}')">
            <i class="fa-solid fa-paper-plane"></i> 🚀 ترحيل للبوابة الحكومية
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 4. فلترة الطلبات والبحث
  function filterRequests() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const status = document.getElementById('status-filter').value;

    const filtered = allRequestsData.filter(item => {
      const matchesSearch = (item.fullName && item.fullName.toLowerCase().includes(query)) ||
                            (item.phone && item.phone.includes(query)) ||
                            (item.appId && item.appId.toLowerCase().includes(query));
      
      const matchesStatus = status === 'ALL' || item.status === status;

      return matchesSearch && matchesStatus;
    });

    renderRequests(filtered);
  }

  // 5. دالة الترحيل للبوابة الحكومية
  function transferToGovPortal(appId) {
    const client = allRequestsData.find(item => item.appId === appId);
    if (!client) return alert("❌ لم يتم العثور على المعاملة!");

    localStorage.setItem('pendingGovTransfer', JSON.stringify(client));
    window.open("https://ecsc.gov.sy", '_blank');
  }
</script>

</body>
</html>
